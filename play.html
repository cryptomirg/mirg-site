<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Play · Made with Mirg</title>
    <meta name="description" content="A game made with Mirg. Play it in your browser, then make your own by describing it." />
    <meta property="og:title" content="Play a game made with Mirg" />
    <meta property="og:description" content="A game made with Mirg. Play it in your browser, then make your own by describing it." />
    <meta property="og:image" content="https://mirg.ai/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mirg: a chat on the left where a game is described, and the finished game running on the right" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mirg.ai/play" />
    <meta property="og:site_name" content="Mirg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0e0f14" />
    <meta name="robots" content="noindex" />
        <link rel="icon" href="assets/icon.png?v=2" />
    <link rel="stylesheet" href="styles.css?v=19" />
  </head>
  <body>
    <header class="site">
      <div class="wrap">
        <a class="logo" href="/"><img src="assets/icon.png?v=2" alt="" />Mirg</a>
        <nav>
          <a class="hide-small" href="/#how">How it works</a>
          <a class="hide-small" href="/#engines">Engines</a>
          <a href="/games">Games</a>
          <a href="/pricing">Pricing</a>
          <a class="btn primary small" href="/download">Download</a>
        </nav>
      </div>
    </header>

    <main class="play">
      <section class="play-head">
        <div class="wrap">
          <h1 id="play-title">Loading the game…</h1>
          <p class="lead" id="play-sub">Made with Mirg</p>
        </div>
      </section>
      <section>
        <div class="wrap">
          <div class="play-frame" id="play-frame">
            <iframe id="play-game" title="The game" allow="fullscreen; gamepad; autoplay" allowfullscreen sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups"></iframe>
            <button class="play-exit" id="play-exit" type="button" aria-label="Exit full screen" hidden>×</button>
            <div class="play-missing" id="play-missing" hidden>
              <strong>This game isn't shared any more.</strong>
              <span>The link may be mistyped, or its maker stopped sharing it.</span>
            </div>
          </div>
          <div class="play-bar">
            <button class="btn" id="play-full" type="button">Full screen</button>
            <span class="spacer"></span>
            <span class="play-made">This game was made by describing it to Mirg.</span>
            <a class="btn primary" href="/">Make your own</a>
          </div>
        </div>
      </section>
    </main>
    <footer class="site">
      <div class="wrap">
        <span>© 2026 Mirg</span>
        <a href="/pricing">Pricing</a>
        <a href="/terms">Terms</a>
        <a href="/privacy">Privacy</a>
        <a href="mailto:support@mirg.ai">support@mirg.ai</a>
        <span class="spacer"></span>
        <span data-version></span>
      </div>
    </footer>
    <script src="site.js?v=20"></script>
    <script src="play.js?v=4"></script>
  </body>
</html>
